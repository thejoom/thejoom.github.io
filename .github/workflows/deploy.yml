name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog-src/package-lock.json

      - name: Install blog dependencies
        working-directory: blog-src
        run: npm ci

      - name: Build blog
        working-directory: blog-src
        run: npm run build

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/blog
          cp index.html _site/
          cp CNAME _site/
          cp robots.txt _site/
          cp sitemap-index.xml _site/
          cp sitemap-root.xml _site/
          # Search engine ownership verification files (Google / Naver)
          shopt -s nullglob
          for f in google*.html naver*.html; do cp "$f" _site/; done
          shopt -u nullglob
          cp -R portfolio _site/
          cp -R static _site/
          cp -R blog-src/dist/. _site/blog/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
